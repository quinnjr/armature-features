[package]
name = "armature-features"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-features"
homepage = "https://quinnjr.github.io/armature"
description = "Feature flags, A/B testing, and gradual rollout for Armature"
keywords = ["features", "flags", "toggles", "ab-testing"]
categories = ["web-programming", "config"]

[dependencies]
armature-core = { version = "0.9" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
sha2 = "0.11"
hex = "0.4"
chrono = "0.4"
rand = "0.10"
regex = "1"

# LaunchDarkly integration (optional)
launchdarkly-server-sdk = { version = "2.6", optional = true }

[features]
default = []
launchdarkly = ["dep:launchdarkly-server-sdk"]

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

